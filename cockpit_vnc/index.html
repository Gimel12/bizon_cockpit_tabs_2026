<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIZON Remote Desktop</title>
<script src="../base1/cockpit.js"></script>
<link rel="stylesheet" href="desktop.css">
<script type="module" src="secure-vnc.js"></script>
</head>
<body>
<header id="intro"><h1>Remote Desktop</h1><p>Your desktop connection uses your signed-in Cockpit session.</p></header>
<main id="desktop-view">
<div id="toolbar" role="toolbar" aria-label="Remote desktop controls">
<button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button>
<span id="status" role="status">Ready</span>
<button id="fullscreen" aria-pressed="false" title="Use your entire display. Press Esc to exit.">Full screen</button>
</div>
<div id="screen" aria-label="Remote desktop"></div>
</main>
<script type="module" src="fullscreen.js"></script>
</body>
</html>
